services:
  - type: web
    name: stark-proofreader
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: TEAM_PASSCODE
        value: stark2026
      - key: SECRET_AUTH_KEY
        value: stark-secret-salt-proofreader-2026
